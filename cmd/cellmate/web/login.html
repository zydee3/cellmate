<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - cellmate</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<aside class="panel"><span class="wordmark">cellmate</span></aside>
<main class="form-side">
  <form method="post" action="/login">
    <h1>Log in</h1>
    {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{.Email}}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-pill" type="submit">Log in</button>
    <a class="back" href="/signup">New here? Create an account</a>
    <a class="back" href="/">Back to home</a>
  </form>
</main>
</body>
</html>
