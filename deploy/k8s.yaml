apiVersion: v1
kind: Namespace
metadata:
  name: cellmate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cellmate-data
  namespace: cellmate
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellmate
  namespace: cellmate
spec:
  replicas: 1
  # The JSON store has a single writer, so never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cellmate
  template:
    metadata:
      labels:
        app: cellmate
    spec:
      # local-path volumes are root-owned, fsGroup lets the nonroot user write.
      securityContext:
        fsGroup: 65532
      containers:
        - name: cellmate
          image: cellmate:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cellmate-data
---
apiVersion: v1
kind: Service
metadata:
  name: cellmate
  namespace: cellmate
spec:
  selector:
    app: cellmate
  ports:
    - port: 8080
      targetPort: 8080
---
# A host rule wins over the catch-all maple-server ingress on 443.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cellmate
  namespace: cellmate
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: cellmate-tls
      hosts: [cellmate.10.0.0.209.sslip.io]
  rules:
    - host: cellmate.10.0.0.209.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cellmate
                port:
                  number: 8080
